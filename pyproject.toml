[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "email-agent"
version = "0.1.0"
description = "Local-first email monitoring agent: urgency, watchlist topics and sender analysis with a local web UI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.34,<0.36",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
    "openai>=1.75,<2",
    "google-api-python-client>=2.160,<3",
    "google-auth-oauthlib>=1.2,<2",
    "google-auth-httplib2>=0.2,<1",
    "msal>=1.32,<2",
    "requests>=2.32,<3",
    "aiosmtpd>=1.4.6,<2",
    "typer>=0.15,<0.17",
    "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
    "httpx>=0.28,<0.29",
    "ruff>=0.11,<0.13",
]

[project.scripts]
email-agent = "email_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/email_agent"]
# The compiled frontend is shipped inside the wheel so `pip install` is enough.
artifacts = ["src/email_agent/web/dist/**"]

[tool.hatch.build.targets.sdist]
include = ["src/email_agent", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# ruff format owns line wrapping; long f-strings and SQL are left as written.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/email_agent/cli.py" = ["B008"]  # typer options are declared in defaults by design
